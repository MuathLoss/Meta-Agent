name: ci
# Spec v1.2, Phase 0: tests, dependency vulnerability scans and a frontend build on every push.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-24.04
    services:
      postgres:
        # Service containers cannot be built, so CI uses the matching published image (fresh database,
        # so the collation note in infra/postgres/Dockerfile does not apply here).
        image: pgvector/pgvector:0.8.1-pg16-trixie
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: migrations_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U test -d migrations_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7.4-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    defaults:
      run:
        working-directory: backend
    env:
      APP_ENV: development
      # Quoted: a value ending in ':' is otherwise read as a YAML key.
      DATABASE_URL: 'sqlite+pysqlite:///:memory:'
      REDIS_TEST_URL: redis://localhost:6379/15
      POSTGRES_TEST_URL: postgresql+psycopg://test:test@localhost:5432/migrations_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt pip-audit==2.10.1
      - name: Generate throwaway CI secrets
        run: |
          echo "APP_SECRET_KEY=$(python -c 'import secrets; print(secrets.token_hex(32))')" >> "$GITHUB_ENV"
          echo "TENANT_CHANNEL_SECRET_KEY=$(python -c 'import base64, os; print(base64.urlsafe_b64encode(os.urandom(32)).decode())')" >> "$GITHUB_ENV"
      - name: Tests
        run: python -m pytest -q -rs
      - name: Dependency vulnerability scan
        run: pip-audit -r requirements.txt

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Type check and build
        run: npm run build
      - name: Dependency vulnerability scan
        run: npm audit --audit-level=high
