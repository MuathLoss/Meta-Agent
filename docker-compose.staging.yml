name: agent-sw-staging
# Local staging: the same services as docker-compose.prod.yml, reachable only on this computer
# at http://127.0.0.1:8088. Start with: scripts/staging.sh start
x-logging: &logging
  driver: json-file
  options: {max-size: 10m, max-file: '3'}
x-backend: &backend
  build: ./backend
  image: agent-sw-local-staging:latest
  env_file: .env.staging
  environment: &environment
    APP_ENV: staging
    DATABASE_URL: postgresql+psycopg://agent_staging:${POSTGRES_PASSWORD:?Run staging.sh init first}@postgres:5432/agent_staging
    REDIS_URL: redis://redis:6379/0
    STORAGE_BACKEND: local
    STORAGE_LOCAL_ROOT: /app/storage
    CORS_ALLOWED_ORIGINS: http://localhost:8088,http://127.0.0.1:8088
    FRONTEND_URL: http://localhost:8088
    ALLOW_UNSIGNED_WEBHOOKS_IN_DEV: 'false'
    EMAIL_POLLING_ENABLED: 'false'
    OLLAMA_ENABLED: 'false'
    # Product scope (spec v1.2, Section 2.1): website widget and WhatsApp only.
    ENABLED_CHANNELS: web_chat,whatsapp
    BROADCASTS_ENABLED: 'false'
    # The backend is only reachable through the proxies on this private network.
    # Trusting that network lets it read the real visitor address they forward,
    # so sign-in, signup and chat limits apply per visitor instead of to everyone.
    FORWARDED_ALLOW_IPS: ${STAGING_SUBNET:-172.28.88.0/24}
  logging: *logging
services:
  postgres:
    # Official PostgreSQL 16 (same Debian as before) plus pgvector; see infra/postgres/Dockerfile.
    build: ./infra/postgres
    image: agent-sw-postgres:16.15-pgvector0.8
    environment:
      POSTGRES_DB: agent_staging
      POSTGRES_USER: agent_staging
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run staging.sh init first}
    volumes: [staging_database:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U agent_staging -d agent_staging]
      interval: 5s
      timeout: 5s
      retries: 15
    restart: unless-stopped
    logging: *logging
  redis:
    image: redis:7.4-alpine
    # Queue only: never evict jobs; append-only file so queued jobs survive a restart.
    command: [redis-server, --appendonly, 'yes', --maxmemory, 128mb, --maxmemory-policy, noeviction]
    volumes: [staging_redis:/data]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    logging: *logging
  migrate:
    <<: *backend
    command: [python, -m, alembic, upgrade, head]
    depends_on:
      postgres: {condition: service_healthy}
    restart: 'no'
  backend:
    <<: *backend
    volumes: [staging_uploads:/app/uploads, staging_storage:/app/storage]
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, -c, 'import urllib.request; urllib.request.urlopen("http://127.0.0.1:8000/health/ready",timeout=3)']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped
  worker:
    <<: *backend
    command: [python, scripts/run_worker.py]
    volumes: [staging_uploads:/app/uploads, staging_storage:/app/storage]
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    healthcheck:
      # Healthy once the worker's own heartbeat job has run recently.
      test: [CMD, python, -c, 'import sys; from app.jobs.periodic import worker_heartbeat_age_seconds as age; a = age(); sys.exit(0 if a is not None and a < 180 else 1)']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s
    restart: unless-stopped
  frontend:
    build: ./frontend
    ports: ['127.0.0.1:8088:80']
    depends_on:
      backend: {condition: service_healthy}
    healthcheck:
      test: [CMD, wget, -q, --spider, http://127.0.0.1/api/health/ready]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    logging: *logging
  telegram:
    # Outside the V1 product. Exits at once unless ENABLED_CHANNELS includes telegram.
    <<: *backend
    command: [python, scripts/run_telegram_polling.py, --loop, --keep-webhook]
    profiles: [provider-workers]
    depends_on:
      backend: {condition: service_healthy}
    restart: on-failure
networks:
  default:
    ipam:
      config:
        - subnet: ${STAGING_SUBNET:-172.28.88.0/24}
volumes:
  staging_database:
  staging_redis:
  staging_uploads:
  staging_storage:
